services:
  # Backend API (FastAPI + Python)
  - type: web
    name: ai-ecommerce-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt && python -m backend.scripts.ingest
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: FAST_SYNTHESIS_MODE
        value: "true"
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "3"

  # Frontend (React + Vite)
  - type: web
    name: ai-ecommerce-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
